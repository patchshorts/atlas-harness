# Opt-in persistent PTY composition for the PTY snapshot scenario. The base
# deployment already owns the shared sandbox provider and policy.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: pty
            name: '@atlasai/atsh-terminal'
          - id: terminal-bash
            name: '@atlasai/atsh-terminal-bash'
            config:
              pollIntervalMs: 10
              exactProbeAfterMs: 20
              idleSilenceMs: 250
              handoffGraceMs: 250
              timeoutMs: 2000
              disposeGraceMs: 500
          - id: tool-terminal
            name: '@atlasai/atsh-tool-terminal'

# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@atlasai/atsh-system-prompt'

- id: tools
  name: '@atlasai/atsh-tools'

- id: subprocess
  name: '@atlasai/atsh-subprocess-local'

- id: bash
  name: '@atlasai/atsh-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@atlasai/atsh-shell-env'

- id: tasks
  name: '@atlasai/atsh-jobs-local'

- id: tool-jobs
  name: '@atlasai/atsh-tool-jobs'

- id: tool-pwsh
  name: '@atlasai/atsh-tool-pwsh'
